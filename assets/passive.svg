<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="t d"><title id="t">关联参考方向 / Passive sign convention</title><desc id="d">Current i enters the left positive terminal of an element; voltage u is positive on the left and negative on the right.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#8a4b12"/></marker></defs><rect width="640" height="240" fill="#fffdf9"/><g fill="none" stroke="#1c1915" stroke-width="2.5"><path d="M80 135H230M410 135H560"/><rect x="230" y="90" width="180" height="90" rx="4"/><path d="M110 65H200" stroke="#8a4b12" marker-end="url(#a)"/></g><g font-family="sans-serif" fill="#1c1915" font-size="23"><text x="150" y="52">i</text><text x="192" y="120">+</text><text x="430" y="120">−</text><text x="310" y="78">u</text><text x="265" y="145">Element</text><text x="223" y="220" font-size="20">p absorbed = u × i</text></g></svg>
