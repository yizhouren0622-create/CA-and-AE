<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d"><title id="t">反相迟滞特性 / Inverting hysteresis characteristic</title><desc id="d">Output is plus 10 V until a rising input crosses plus 2 V, then minus 10 V. On falling input it returns to plus 10 V at minus 2 V.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#8a4b12"/></marker></defs><rect width="640" height="340" fill="#fffdf9"/><g fill="none" stroke="#6d6256" stroke-width="1.5"><path d="M60 170H585M320 300V28"/><path d="M220 60V285M420 60V285" stroke-dasharray="5 5"/></g><g fill="none" stroke="#8a4b12" stroke-width="3"><path d="M80 65H420V275H560M560 275H220V65H80"/><path d="M260 65H365M420 105V235M380 275H270M220 240V105" marker-end="url(#a)"/></g><g font-family="sans-serif" fill="#1c1915" font-size="21"><text x="578" y="195">v<tspan baseline-shift="sub" font-size="15">i</tspan></text><text x="331" y="30">v<tspan baseline-shift="sub" font-size="15">o</tspan></text><text x="170" y="318">−2 V</text><text x="400" y="318">+2 V</text><text x="63" y="48">+10 V</text><text x="490" y="309">−10 V</text></g></svg>
