<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img"><title>Exercise 1-44: three simplest Thevenin equivalents</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#225ac7"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#192435" font-size="18" stroke-linecap="round"><g transform="translate(10,10)"><rect width="340" height="350" rx="14" fill="#f7f9fc" stroke="#dce2ea"/><text x="170" y="30" text-anchor="middle">(a) Thevenin equivalent</text><path d="M75 100H135M195 100H280M75 100V173M75 227V285H280" fill="none" stroke="#192435" stroke-width="2.5"/><rect x="135" y="89" width="60" height="22" fill="white" stroke="#192435" stroke-width="2.5"/><text x="165" y="73" text-anchor="middle">2 Ω</text><circle cx="75" cy="200" r="27" fill="white" stroke="#192435" stroke-width="2.5"/><text x="75" y="190" text-anchor="middle">+</text><text x="75" y="216" text-anchor="middle">−</text><text x="115" y="207">9 V</text><circle cx="280" cy="100" r="5" fill="white" stroke="#192435" stroke-width="2"/><circle cx="280" cy="285" r="5" fill="white" stroke="#192435" stroke-width="2"/><text x="295" y="106">a</text><text x="295" y="291">b</text><path d="M217 100H253" fill="none" stroke="#225ac7" stroke-width="2" marker-end="url(#arr)"/><text x="235" y="80" text-anchor="middle" fill="#225ac7" font-size="15">i_out</text><text x="170" y="330" text-anchor="middle" font-size="17">u = 9 − 2 i_out</text></g><g transform="translate(370,10)"><rect width="340" height="350" rx="14" fill="#f7f9fc" stroke="#dce2ea"/><text x="170" y="30" text-anchor="middle">(b) Thevenin equivalent</text><path d="M75 100H135M195 100H280M75 100V173M75 227V285H280" fill="none" stroke="#192435" stroke-width="2.5"/><rect x="135" y="89" width="60" height="22" fill="white" stroke="#192435" stroke-width="2.5"/><text x="165" y="73" text-anchor="middle">1 Ω</text><circle cx="75" cy="200" r="27" fill="white" stroke="#192435" stroke-width="2.5"/><text x="75" y="190" text-anchor="middle">−</text><text x="75" y="216" text-anchor="middle">+</text><text x="115" y="207">9 V</text><circle cx="280" cy="100" r="5" fill="white" stroke="#192435" stroke-width="2"/><circle cx="280" cy="285" r="5" fill="white" stroke="#192435" stroke-width="2"/><text x="295" y="106">a</text><text x="295" y="291">b</text><path d="M217 100H253" fill="none" stroke="#225ac7" stroke-width="2" marker-end="url(#arr)"/><text x="235" y="80" text-anchor="middle" fill="#225ac7" font-size="15">i_out</text><text x="170" y="330" text-anchor="middle" font-size="17">u = −9 − i_out</text></g><g transform="translate(730,10)"><rect width="340" height="350" rx="14" fill="#f7f9fc" stroke="#dce2ea"/><text x="170" y="30" text-anchor="middle">(c) Thevenin equivalent</text><path d="M75 100H135M195 100H280M75 100V173M75 227V285H280" fill="none" stroke="#192435" stroke-width="2.5"/><rect x="135" y="89" width="60" height="22" fill="white" stroke="#192435" stroke-width="2.5"/><text x="165" y="73" text-anchor="middle">2.5 Ω</text><circle cx="75" cy="200" r="27" fill="white" stroke="#192435" stroke-width="2.5"/><text x="75" y="190" text-anchor="middle">+</text><text x="75" y="216" text-anchor="middle">−</text><text x="115" y="207">2 V</text><circle cx="280" cy="100" r="5" fill="white" stroke="#192435" stroke-width="2"/><circle cx="280" cy="285" r="5" fill="white" stroke="#192435" stroke-width="2"/><text x="295" y="106">a</text><text x="295" y="291">b</text><path d="M217 100H253" fill="none" stroke="#225ac7" stroke-width="2" marker-end="url(#arr)"/><text x="235" y="80" text-anchor="middle" fill="#225ac7" font-size="15">i_out</text><text x="170" y="330" text-anchor="middle" font-size="17">u = 2 − 2.5 i_out</text></g><text x="540" y="382" text-anchor="middle" font-size="16" fill="#536172">u = Va − Vb; i_out leaves a. Voltages in V, currents in A.</text></g></svg>