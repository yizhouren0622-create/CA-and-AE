<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d"><title id="t">二极管恒压降模型 / Diode constant-drop model</title><desc id="d">A 5 V source feeds 1 kilohm, then a diode with anode on the left and cathode on the right, returning to the source negative terminal.</desc><rect width="640" height="300" fill="#fffdf9"/><g fill="none" stroke="#1c1915" stroke-width="2.5"><path d="M90 120V80H180M280 80H355M395 80H510V250H90V200"/><circle cx="90" cy="160" r="40"/><rect x="180" y="70" width="100" height="20"/><path d="M355 58L395 80L355 102Z M395 55V105"/></g><g font-family="sans-serif" fill="#1c1915" font-size="22"><text x="80" y="150">+</text><text x="81" y="184">−</text><text x="22" y="222">5 V</text><text x="205" y="53">1 kΩ</text><text x="334" y="132">A</text><text x="397" y="132">K</text><text x="325" y="190">v<tspan baseline-shift="sub" font-size="15">D</tspan> = v<tspan baseline-shift="sub" font-size="15">A</tspan> − v<tspan baseline-shift="sub" font-size="15">K</tspan></text></g></svg>
