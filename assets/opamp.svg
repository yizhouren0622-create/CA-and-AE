<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d"><title id="t">反相运放 / Inverting op-amp</title><desc id="d">Input vi connects through Rin to the inverting input. Rf connects output vo back to the same node. The non-inverting input is grounded. Power rails are omitted.</desc><rect width="640" height="340" fill="#fffdf9"/><g fill="none" stroke="#1c1915" stroke-width="2.5"><path d="M35 150H80M160 150H280M280 110L440 190L280 270Z M440 190H565M520 190V70H360M250 70H200V150M280 230H225V285M205 285H245M211 293H239M217 301H233"/><rect x="80" y="140" width="80" height="20"/><rect x="250" y="60" width="110" height="20"/></g><g fill="#1c1915"><circle cx="200" cy="150" r="4"/><circle cx="520" cy="190" r="4"/></g><g font-family="sans-serif" fill="#1c1915" font-size="23"><text x="20" y="130">v<tspan baseline-shift="sub" font-size="16">i</tspan></text><text x="102" y="128">R<tspan baseline-shift="sub" font-size="16">in</tspan></text><text x="292" y="157">−</text><text x="292" y="237">+</text><text x="290" y="47">R<tspan baseline-shift="sub" font-size="16">f</tspan></text><text x="555" y="173">v<tspan baseline-shift="sub" font-size="16">o</tspan></text><text x="355" y="315" font-size="17">Supply rails omitted</text></g></svg>
